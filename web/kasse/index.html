<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TreueBiss – Kasse</title>
<meta name="theme-color" content="#4CAF50">
<link rel="preload" href="../gemeinsam/fonts/familjen-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../gemeinsam/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../gemeinsam/basis.css">
<style>
  /*
    Werkzeug des Personals, nicht Schaufenster des Betriebs: Die Kasse bleibt
    bei der Vorgabefarbe. Wer zwischen zwei Filialen wechselt, soll dieselbe
    Oberfläche vorfinden - und an der Kasse hilft ein eingefärbter Rahmen
    niemandem, Tempo aber sehr.
  */
  .kopf {
    background: var(--grund); color: var(--grund-text);
    padding: calc(env(safe-area-inset-top) + var(--s5)) var(--s5) var(--s7);
    border-radius: 0 0 var(--s5) var(--s5);
  }
  .kopf-innen { max-width: 460px; margin: 0 auto; }
  .kopf h1 { font-size: var(--t-display); font-weight: 700; margin: 0; line-height: 1.2; }
  .kopf p {
    margin: var(--s1) 0 0; font-size: var(--t-mikro); letter-spacing: .11em;
    text-transform: uppercase; color: var(--grund-leise);
  }

  main { max-width: 460px; margin: calc(var(--s6) * -1) auto 0; padding: 0 var(--s5) var(--s7); }

  /*
    Die Bestätigung ist der eine Moment, auf den es hier ankommt: Die
    Verkaufskraft schaut im Vorbeigehen hin, mit dem Kunden gegenüber. Nicht
    eine Zeile Text unter vielen, sondern eine Fläche, die man aus einem
    Meter Abstand liest.
  */
  .bestaetigung {
    background: var(--gut); color: var(--gut-text);
    border-radius: var(--s5); padding: var(--s5);
    margin-bottom: var(--s4); text-align: center;
  }
  .bestaetigung .haken {
    width: var(--s7); height: var(--s7); margin: 0 auto var(--s3);
    border-radius: 50%; background: var(--marke); color: var(--marke-text);
    display: grid; place-items: center; font-size: var(--t-gross);
    animation: aufgehen 240ms cubic-bezier(.2, .8, .3, 1) both;
  }
  .bestaetigung b {
    display: block; font-family: var(--display);
    font-size: var(--t-gross); font-weight: 700; line-height: 1.15;
  }
  .bestaetigung span { font-size: var(--t-klein); }
  @keyframes aufgehen {
    from { transform: scale(.6); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  video {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    border-radius: var(--s3); background: var(--grund);
    display: block; margin-bottom: var(--s4);
  }
  .trenner {
    border: 0; border-top: 1px solid var(--linie-zart);
    margin: var(--s5) calc(var(--s5) * -1);
  }

  /* Zahlen sind Nachschlagewerk, nicht Hauptsache - deshalb nebenan. */
  .zahlen { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
  .zahl {
    border: 1px solid var(--linie-zart); border-radius: var(--s3);
    padding: var(--s3) var(--s4);
  }
  .zahl b {
    display: block; font-family: var(--display); font-weight: 700;
    font-size: var(--t-display); font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .zahl span { font-size: var(--t-mikro); color: var(--tinte-leise); }
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-innen">
    <h1>Kasse</h1>
    <p id="betrieb">TreueBiss</p>
  </div>
</header>

<main>
  <div id="bestaetigung" role="status" aria-live="polite"></div>
  <div id="meldung" role="status" aria-live="polite"></div>

  <!-- Anmeldung -->
  <section id="anmeldung" class="karte">
    <p class="marke">Anmeldung</p>
    <label for="email">E-Mail</label>
    <input id="email" type="email" autocomplete="username" inputmode="email">
    <label for="passwort">Passwort</label>
    <input id="passwort" type="password" autocomplete="current-password">
    <button id="anmelden">Anmelden</button>
  </section>

  <!-- Einlösen -->
  <section id="kasse" class="karte verborgen">
    <p class="marke">Gutschein einlösen</p>
    <video id="video" playsinline muted class="verborgen"></video>
    <div id="scanner-bereich">
      <button id="scannen" class="verborgen">QR-Code scannen</button>
      <p id="kein-scanner" class="hinweis verborgen"></p>
    </div>
    <hr class="trenner">
    <label for="code">Gutschein-Nummer</label>
    <input id="code" placeholder="z. B. 7aa68458-61fc-…" autocapitalize="off" spellcheck="false">
    <button id="einloesen" class="still">Von Hand einlösen</button>
  </section>

  <!-- Zahlen -->
  <section id="zahlen-bereich" class="karte neben verborgen">
    <p class="marke">Zahlen dieses Betriebs</p>
    <div class="zahlen" id="zahlen"></div>
    <div class="reihe" style="margin-top: var(--s5)">
      <button id="abmelden" class="still">Abmelden</button>
    </div>
  </section>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Aus supabase/config.js - siehe web/kasse/config.example.js
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

/*
 * Eigener Speicherschlüssel je Oberfläche.
 *
 * Ohne ihn teilen sich alle drei Seiten unter derselben Adresse EINE
 * Anmeldung: Der Supabase-Client legt sein Token unter `sb-<projekt>-auth-
 * token` ab, für alle gleich. Die Folgen sind still und übel - eine
 * Verkaufskraft, die auf dem Kassengerät die Kundenseite öffnet, sammelt
 * Stempel auf den Kassenzugang, weil dort schon eine Sitzung liegt und gar
 * keine anonyme Anmeldung mehr stattfindet. Umgekehrt steht die Kasse
 * plötzlich mit einer anonymen Sitzung da und meldet, der Zugang gehöre zu
 * keinem Betrieb.
 */
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY,
  { auth: { storageKey: 'treuebiss-kasse' } });
const $ = (id) => document.getElementById(id);
let scanLaeuft = false;

function melden(text) {
  $('meldung').innerHTML = text ? `<div class="meldung">${text}</div>` : '';
  if (text) $('bestaetigung').innerHTML = '';
}

/*
 * Der Erfolgsfall bekommt eine eigene Flaeche statt einer Textzeile. An der
 * Kasse schaut die Verkaufskraft im Vorbeigehen hin, mit dem Kunden
 * gegenueber - eine Zeile unter anderen Zeilen wird dabei uebersehen.
 */
function bestaetigen(zeit) {
  $('meldung').innerHTML = '';
  $('bestaetigung').innerHTML = `<div class="bestaetigung">
      <div class="haken" aria-hidden="true">&check;</div>
      <b>Eingelöst</b>
      <span>${zeit} Uhr &middot; Guten Appetit!</span>
    </div>`;
}

/** Sperrt einen Knopf, solange seine Anfrage laeuft. */
function beschaeftigt(knopf, an, text) {
  if (!knopf) return;
  if (an) {
    knopf.dataset.ruhetext ??= knopf.textContent;
    knopf.textContent = text;
    knopf.disabled = true;
  } else {
    knopf.textContent = knopf.dataset.ruhetext ?? knopf.textContent;
    knopf.disabled = false;
  }
}

/**
 * Erreichte die Anfrage den Server ueberhaupt? Ein Netzwerkfehler hat keinen
 * HTTP-Status - die Unterscheidung ist wichtig, weil sonst ein Verbindungs-
 * abbruch wie ein Tippfehler aussieht und an der Kasse jemand dreimal das
 * Passwort neu eingibt.
 */
function istNetzfehler(fehler) {
  if (/fetch|network|Failed to send/i.test(fehler?.message ?? '')) return true;
  if (fehler?.name?.includes('Retryable')) return true;
  // Vorsichtig sein: Ein PostgrestError traegt den SQLSTATE in `code`, ein
  // AuthError einen HTTP-Status in `status`. Fehlt beides, kam die Anfrage
  // nicht an. Wer nur auf `status` prueft, haelt jeden Datenbankfehler
  // faelschlich fuer einen Verbindungsabbruch.
  return !fehler?.code && !fehler?.status;
}

/** Uebersetzt die Fehlercodes der Datenbankfunktionen in Klartext. */
function fehlertext(fehler) {
  if (istNetzfehler(fehler)) return 'Keine Verbindung zum Server.';
  const t = (fehler?.message ?? '') + (fehler?.details ?? '');
  if (t.includes('not staff')) return 'Dieser Zugang gehört nicht zu diesem Betrieb.';
  if (t.includes('already redeemed')) return 'Dieser Gutschein wurde bereits eingelöst.';
  if (t.includes('expired')) return 'Dieser Gutschein ist abgelaufen.';
  if (t.includes('not found')) return 'Diesen Gutschein gibt es nicht.';
  return 'Es hat nicht geklappt. Bitte noch einmal versuchen.';
}

/** Fehler bei der Anmeldung, nach Ursache getrennt. */
function anmeldeFehlertext(fehler) {
  if (istNetzfehler(fehler)) {
    return 'Keine Verbindung zum Server. Prüfe die Internetverbindung '
         + 'und die Adresse in <code>config.js</code>.';
  }
  const t = fehler?.message ?? '';
  if (/not confirmed/i.test(t)) {
    return 'Dieser Zugang ist noch nicht bestätigt. Im Supabase-Dashboard '
         + 'unter Authentication → Users „Auto Confirm User“ setzen.';
  }
  if (/invalid login/i.test(t)) return 'E-Mail oder Passwort stimmt nicht.';
  return 'Anmeldung fehlgeschlagen: ' + t;
}

/**
 * Nicht ausgefuellte Konfiguration frueh erkennen. Sonst schlaegt jede
 * Anmeldung fehl und sieht aus, als stimme das Passwort nicht.
 */
function konfigurationFehlt() {
  return !SUPABASE_URL || SUPABASE_URL.includes('DEIN-PROJEKT')
      || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('DEIN_ANON_KEY');
}

async function einloesen(gutscheinId) {
  const id = gutscheinId.trim();
  if (!id) return;
  melden('');
  beschaeftigt($('einloesen'), true, 'Einen Moment …');
  const { data, error } = await db.rpc('staff_redeem_voucher', { p_voucher_id: id });
  beschaeftigt($('einloesen'), false);
  if (error) { console.error('staff_redeem_voucher', error); melden(fehlertext(error)); return; }
  const zeit = new Date(data[0].redeemed_at)
    .toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  bestaetigen(zeit);
  $('code').value = '';
  await zahlenLaden();  // Bestaetigung nicht ueberschreiben: der Erfolg zaehlt hier.
}

/**
 * Laedt die Zahlen des Betriebs.
 *
 * Gibt zurueck, was schiefging - ein Fehler der Datenbankfunktion darf nicht
 * genauso aussehen wie "kein Betrieb zugeordnet", sonst sucht man an der
 * falschen Stelle.
 *
 * @returns {'ok'|'kein-betrieb'|{fehler: string}}
 */
async function zahlenLaden() {
  const { data, error } = await db.rpc('staff_pilot_summary');
  if (error) {
    if (istNetzfehler(error)) return { fehler: 'Keine Verbindung zum Server.' };
    if (/does not exist|schema cache/i.test(error.message ?? '')) {
      return { fehler: 'Die Kassenfunktionen fehlen in der Datenbank. '
                     + 'Wurde <code>supabase/schema.sql</code> eingespielt?' };
    }
    return { fehler: 'Die Zahlen konnten nicht geladen werden: ' + error.message };
  }
  if (!data?.length) return 'kein-betrieb';
  const z = data[0];
  $('betrieb').textContent = z.tenant;
  $('zahlen').innerHTML = [
    [z.members, 'Teilnehmer'],
    [z.stamps_issued, 'Stempel gesamt'],
    [z.stamps_per_active_day ?? '–', 'Stempel pro Tag'],
    [z.vouchers_redeemed + ' / ' + z.vouchers_created, 'Gutscheine eingelöst'],
  ].map(([wert, was]) => `<div class="zahl"><b>${wert}</b><span>${was}</span></div>`).join('');
  return 'ok';
}

/**
 * Scannen ueber die BarcodeDetector-API. Sie fehlt in Safari und Firefox,
 * und die Kamera braucht https oder localhost - aus einer lokal geoeffneten
 * Datei geht sie nicht. Deshalb ist die manuelle Eingabe gleichwertig und
 * nicht nur Notloesung.
 */
async function scannerVorbereiten() {
  const gehtNicht = (grund) => {
    $('kein-scanner').textContent = grund + ' Gib die Nummer unten ein.';
    $('kein-scanner').classList.remove('verborgen');
  };
  if (!('BarcodeDetector' in window)) {
    return gehtNicht('Dieser Browser kann keine QR-Codes lesen.');
  }
  if (!window.isSecureContext) {
    return gehtNicht('Die Kamera braucht eine https-Adresse.');
  }
  $('scannen').classList.remove('verborgen');
  $('scannen').onclick = starteScan;
}

async function starteScan() {
  if (scanLaeuft) return;
  const video = $('video');
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    await video.play();
  } catch {
    melden('Kein Zugriff auf die Kamera.');
    return;
  }
  video.classList.remove('verborgen');
  $('scannen').textContent = 'Scan läuft …';
  $('scannen').disabled = true;
  scanLaeuft = true;

  const detector = new BarcodeDetector({ formats: ['qr_code'] });
  const suchen = async () => {
    if (!scanLaeuft) return;
    try {
      const treffer = await detector.detect(video);
      if (treffer.length) { await scanBeenden(treffer[0].rawValue); return; }
    } catch { /* einzelne Frames duerfen fehlschlagen */ }
    requestAnimationFrame(suchen);
  };
  requestAnimationFrame(suchen);
}

async function scanBeenden(wert) {
  scanLaeuft = false;
  const video = $('video');
  video.srcObject?.getTracks().forEach((t) => t.stop());
  video.classList.add('verborgen');
  $('scannen').textContent = 'QR-Code scannen';
  $('scannen').disabled = false;
  if (wert) await einloesen(wert);
}

function zeigeAngemeldet(ja) {
  $('anmeldung').classList.toggle('verborgen', ja);
  $('kasse').classList.toggle('verborgen', !ja);
  $('zahlen-bereich').classList.toggle('verborgen', !ja);
}

$('anmelden').onclick = async () => {
  melden('');
  beschaeftigt($('anmelden'), true, 'Wird geprüft …');
  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('passwort').value,
  });
  beschaeftigt($('anmelden'), false);
  if (error) { console.error('signIn', error); melden(anmeldeFehlertext(error)); return; }
  $('passwort').value = '';
  await starten();
};

$('abmelden').onclick = async () => {
  await scanBeenden(null);
  await db.auth.signOut();
  $('betrieb').textContent = 'TreueBiss';
  $('bestaetigung').innerHTML = '';
  melden('');
  zeigeAngemeldet(false);
};

$('einloesen').onclick = () => einloesen($('code').value);
$('code').onkeydown = (e) => { if (e.key === 'Enter') einloesen($('code').value); };

async function starten() {
  if (konfigurationFehlt()) {
    melden('<code>web/kasse/config.js</code> ist nicht ausgefüllt. '
         + 'Trage dort URL und Anon-Key deines Supabase-Projekts ein.');
    $('anmeldung').classList.add('verborgen');
    return;
  }
  const { data } = await db.auth.getSession();
  if (!data.session) { zeigeAngemeldet(false); return; }
  zeigeAngemeldet(true);
  const stand = await zahlenLaden();
  await scannerVorbereiten();

  if (stand === 'kein-betrieb') {
    melden('Dieser Zugang ist keinem Betrieb zugeordnet. Fehlt der Eintrag '
         + 'in <code>tenant_staff</code>?');
  } else if (typeof stand === 'object') {
    melden(stand.fehler);
  }
}

starten();
</script>
</body>
</html>
