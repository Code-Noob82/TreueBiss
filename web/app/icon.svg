    <circle cx="286" cy="222" r="21"/>
  </g>
  <g fill="none" stroke="#4CAF50" stroke-width="9" opacity="0.45">
    <circle cx="344" cy="222" r="17"/>
    <circle cx="170" cy="290" r="17"/>
    <circle cx="228" cy="290" r="17"/>
    <circle cx="286" cy="290" r="17"/>
    <circle cx="344" cy="290" r="17"/>
  </g>
</svg>
