<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TreueBiss</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" id="theme-farbe" content="#4CAF50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    /* Wird zur Laufzeit auf die Farbe des Betriebs gesetzt. */
    --marke: #4CAF50;
    --marke-tief: #3d8b40;
    --grau: #f4f4f5; --text: #18181b; --schwach: #71717a; --rand: #d4d4d8;
    --rot: #c62828;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--grau); color: var(--text); line-height: 1.5;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 480px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  header h1 { font-size: 1.25rem; margin: 0; }

  .karte {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 1px 3px rgb(0 0 0 / .08); margin-bottom: 16px;
  }
  h2 { font-size: 1rem; margin: 0 0 14px; }

  /* --------------------------------------------------------- Stempelkarte */
  .stand { display: flex; align-items: baseline; gap: 8px; margin: 0 0 14px; }
  .stand b { font-size: 2rem; line-height: 1; color: var(--marke-tief); }
  .stand span { color: var(--schwach); font-size: .9rem; }

  .punkte { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .punkt {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--rand); display: grid; place-items: center;
  }
  .punkt.voll { background: var(--marke); border-color: var(--marke); }
  .punkt.voll::after {
    content: ""; width: 12px; height: 12px; border-radius: 50%; background: #fff;
  }

  button {
    width: 100%; padding: 14px; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--marke); color: #fff;
    cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.sekundaer { background: #fff; color: var(--text); border: 1px solid var(--rand); }
  button.schmal { width: auto; padding: 9px 14px; font-size: .9rem; }
  .knopfreihe { display: flex; flex-wrap: wrap; gap: 8px; }
  .knopfreihe button { width: auto; flex: 1 1 auto; }

  input {
    width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--rand);
    border-radius: 10px; margin-bottom: 10px; font-family: inherit;
  }

  video { width: 100%; border-radius: 12px; background: #000; display: block; margin-bottom: 12px; }

  /* ------------------------------------------------------------ Meldungen */
  .meldung { padding: 14px; border-radius: 12px; margin-bottom: 16px; font-weight: 500; }
  .meldung.gut { background: #e8f5e9; color: var(--marke-tief); }
  .meldung.schlecht { background: #ffebee; color: var(--rot); }
  .meldung code { background: rgb(0 0 0 / .07); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .band {
    background: #fff8e1; color: #8a6011; border-radius: 12px;
    padding: 10px 14px; margin-bottom: 16px; font-size: .88rem;
  }

  /* ------------------------------------------------------------ Gutscheine */
  .gutschein {
    border: 1px solid var(--rand); border-radius: 12px; padding: 14px;
    margin-bottom: 10px;
  }
  .gutschein b { display: block; }
  .gutschein small { color: var(--schwach); }
  .gutschein.abgelaufen { opacity: .55; }
  .gutschein .knopfreihe { margin-top: 10px; }

  .angebot { border-top: 1px solid var(--rand); padding-top: 12px; margin-top: 12px; }
  .angebot:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .angebot b { display: block; }
  .angebot small { color: var(--schwach); }

  .leer { color: var(--schwach); font-size: .9rem; margin: 0; }
  .hinweis { font-size: .8rem; color: var(--schwach); line-height: 1.5; }
  .verborgen { display: none; }

  footer { margin-top: 24px; }
  footer a { color: var(--schwach); }
</style>
</head>
<body>
<main>
  <header>
    <img id="logo" class="verborgen" alt="">
    <h1 id="betrieb">TreueBiss</h1>
  </header>

  <div id="band"></div>
  <div id="meldung"></div>

  <!-- Stempelkarte -->
  <section id="karte-bereich" class="karte verborgen">
    <h2 id="karte-titel">Treuepunkte</h2>
    <p class="stand"><b id="stand-zahl">0</b><span id="stand-text">von 10</span></p>
    <div class="punkte" id="punkte"></div>

    <div id="scanner" class="verborgen">
      <video id="video" playsinline muted></video>
      <label for="beleg">Oder die Belegnummer eintippen</label>
      <input id="beleg" autocapitalize="off" spellcheck="false" placeholder="Nummer vom Kassenbon">
      <div class="knopfreihe">
        <button id="beleg-senden">Stempel holen</button>
        <button id="scan-abbrechen" class="sekundaer">Abbrechen</button>
      </div>
    </div>

    <button id="sammeln">Stempel sammeln</button>
  </section>

  <!-- Gutscheine -->
  <section id="gutscheine-bereich" class="karte verborgen">
    <h2 id="gutscheine-titel">Gutscheine</h2>
    <div id="gutscheine"></div>
  </section>

  <!-- Angebote -->
  <section id="angebote-bereich" class="karte verborgen">
    <h2 id="angebote-titel">Angebot des Tages</h2>
    <div id="angebote"></div>
  </section>

  <footer>
    <p class="hinweis" id="fuss"></p>
    <p id="rechtliches" class="hinweis"></p>
  </footer>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
