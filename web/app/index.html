<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TreueBiss</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" id="theme-farbe" content="#4CAF50">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="./fonts/familjen-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Selbst ausgeliefert, nicht von Google geladen: siehe fonts/LIESMICH.md.
     Beides Variable Fonts - eine Datei deckt alle Schnitte ab. */
  @font-face {
    font-family: "Familjen Grotesk";
    src: url("./fonts/familjen-grotesk-latin.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Public Sans";
    src: url("./fonts/public-sans-latin.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }

  /*
    Die ganze Palette wird zur Laufzeit aus der Farbe des Betriebs gerechnet.
    app.js setzt nur drei Werte - Farbton, Saettigung und die Marke selbst -,
    alles Weitere leitet sich hier ab. So traegt jede Baeckerei ihre eigene
    Flaeche, statt nur einen anders eingefaerbten Knopf zu bekommen.
  */
  :root {
    --h: 122;
    --s: 30%;
    --marke: #4CAF50;
    --marke-text: #ffffff;

    --grund:       hsl(var(--h) calc(var(--s) * 0.9) 13%);
    --grund-text:  hsl(var(--h) calc(var(--s) * 0.5) 97%);
    --grund-leise: hsl(var(--h) calc(var(--s) * 0.3) 76%);
    --papier:      hsl(var(--h) calc(var(--s) * 0.5) 97.5%);
    --karte:       hsl(var(--h) calc(var(--s) * 0.6) 99.6%);
    --tinte:       hsl(var(--h) calc(var(--s) * 0.6) 12%);
    --tinte-leise: hsl(var(--h) calc(var(--s) * 0.25) 42%);
    --linie:       hsl(var(--h) calc(var(--s) * 0.35) 88%);
    --linie-zart:  hsl(var(--h) calc(var(--s) * 0.3) 93%);
    --leer:        hsl(var(--h) calc(var(--s) * 0.3) 85%);

    --gut:      hsl(var(--h) calc(var(--s) * 0.5) 94%);
    --gut-text: hsl(var(--h) calc(var(--s) * 0.9) 24%);
    --warn:     #fdf3e0;
    --warn-text:#7c5410;
    --rot:      #fdecea;
    --rot-text: #9c2d22;

    --hoehe: 0 1px 1px hsl(var(--h) 20% 10% / .04),
             0 6px 20px -10px hsl(var(--h) 25% 12% / .18);

    --display: "Familjen Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --lauf: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --grund:       hsl(var(--h) calc(var(--s) * 0.7) 9%);
      --grund-text:  hsl(var(--h) calc(var(--s) * 0.3) 95%);
      --grund-leise: hsl(var(--h) calc(var(--s) * 0.2) 66%);
      --papier:      hsl(var(--h) calc(var(--s) * 0.4) 11%);
      --karte:       hsl(var(--h) calc(var(--s) * 0.4) 15%);
      --tinte:       hsl(var(--h) calc(var(--s) * 0.2) 94%);
      --tinte-leise: hsl(var(--h) calc(var(--s) * 0.15) 66%);
      --linie:       hsl(var(--h) calc(var(--s) * 0.3) 26%);
      --linie-zart:  hsl(var(--h) calc(var(--s) * 0.3) 21%);
      --leer:        hsl(var(--h) calc(var(--s) * 0.25) 32%);

      --gut:      hsl(var(--h) calc(var(--s) * 0.5) 20%);
      --gut-text: hsl(var(--h) calc(var(--s) * 0.5) 84%);
      --warn:     #35291380; --warn-text: #e8c07a;
      --rot:      #3a1e1a80; --rot-text: #f0a094;
      --hoehe:    0 1px 1px #0006, 0 8px 24px -12px #000a;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--papier);
    color: var(--tinte);
    font-family: var(--lauf);
    font-size: 1rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }

  /* ---------------------------------------------------------------- Kopf */
  .kopf {
    background: var(--grund);
    color: var(--grund-text);
    padding: calc(env(safe-area-inset-top) + 22px) 20px 46px;
    /* Der Bogen unten nimmt die Rundung der Karte auf, die darauf liegt. */
    border-radius: 0 0 26px 26px;
  }
  .kopf-innen {
    max-width: 460px; margin: 0 auto;
    display: flex; align-items: center; gap: 13px;
  }
  .kopf img {
    width: 46px; height: 46px; border-radius: 12px; object-fit: cover;
    background: hsl(var(--h) 10% 100% / .12);
  }
  .kopf h1 {
    font-family: var(--display);
    font-size: 1.45rem; font-weight: 700; letter-spacing: -.012em;
    margin: 0; line-height: 1.15; text-wrap: balance;
  }
  .kopf p {
    margin: 1px 0 0; font-size: .78rem; letter-spacing: .11em;
    text-transform: uppercase; color: var(--grund-leise);
  }

  main { max-width: 460px; margin: -32px auto 0; padding: 0 20px 40px; }

  /* --------------------------------------------------------------- Karten */
  .karte {
    background: var(--karte);
    border: 1px solid var(--linie-zart);
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--hoehe);
    margin-bottom: 16px;
  }
  .marke {
    font-family: var(--display);
    font-size: .74rem; font-weight: 600;
    letter-spacing: .13em; text-transform: uppercase;
    color: var(--tinte-leise);
    margin: 0 0 14px;
  }

  /* --------------------------------------------------------- Stempelkarte */
  .fortschritt {
    font-family: var(--display);
    font-size: 1.42rem; font-weight: 600; line-height: 1.25;
    letter-spacing: -.011em;
    margin: 0 0 3px; text-wrap: balance;
  }
  .fortschritt b { color: var(--marke); font-weight: 700; }
  .zaehler {
    font-size: .82rem; color: var(--tinte-leise);
    font-variant-numeric: tabular-nums; margin: 0 0 20px;
  }

  .punkte {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 13px 10px;
    margin-bottom: 22px;
    justify-items: center;
  }
  .punkt {
    width: 100%; max-width: 46px; aspect-ratio: 1;
    border-radius: 50%;
    border: 2px dashed var(--leer);
    display: grid; place-items: center;
  }
  /*
    Ein Stempel sitzt nie gerade. Die Drehung kommt aus dem Index, ist also
    fuer jedes Feld immer dieselbe - sonst wackelte die Karte bei jedem
    Neuzeichnen.
  */
  .punkt.voll {
    border: 0;
    background:
      radial-gradient(circle at 34% 30%, hsl(0 0% 100% / .28), transparent 58%),
      var(--marke);
    transform: rotate(var(--dreh, 0deg));
    box-shadow: inset 0 0 0 1px hsl(var(--h) 40% 20% / .12);
  }
  .punkt.voll::after {
    content: "";
    width: 34%; height: 34%; border-radius: 50%;
    background: var(--marke-text); opacity: .82;
  }
  .punkt.frisch { animation: stempeln .42s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes stempeln {
    0%   { transform: rotate(var(--dreh, 0deg)) scale(1.75); opacity: 0; }
    55%  { transform: rotate(var(--dreh, 0deg)) scale(.93); opacity: 1; }
    100% { transform: rotate(var(--dreh, 0deg)) scale(1); opacity: 1; }
  }

  /* --------------------------------------------------------------- Knöpfe */
  button {
    font-family: var(--display);
    font-size: 1rem; font-weight: 600; letter-spacing: .005em;
    width: 100%; padding: 15px 18px;
    border: 0; border-radius: 14px;
    background: var(--marke); color: var(--marke-text);
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(.995); }
  button:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
  button:focus-visible { outline: 3px solid var(--marke); outline-offset: 3px; }
  button.still {
    background: transparent; color: var(--tinte);
    border: 1px solid var(--linie);
  }
  button.klein { width: auto; padding: 11px 18px; font-size: .92rem; }
  .reihe { display: flex; gap: 9px; }
  .reihe button { flex: 1 1 0; }

  /* -------------------------------------------------------------- Scanner */
  label {
    display: block; font-size: .78rem; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase;
    color: var(--tinte-leise); margin-bottom: 7px;
  }
  input {
    width: 100%; padding: 13px 14px; font-size: 1rem;
    font-family: inherit; color: inherit;
    background: var(--papier);
    border: 1px solid var(--linie); border-radius: 12px;
    margin-bottom: 13px;
  }
  input:focus-visible { outline: 2px solid var(--marke); outline-offset: 1px; }
  video {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    border-radius: 14px; background: var(--grund);
    display: block; margin-bottom: 15px;
  }

  /* ------------------------------------------------------------ Meldungen */
  .meldung {
    border-radius: 14px; padding: 13px 16px; margin-bottom: 16px;
    font-size: .93rem; font-weight: 500;
    background: var(--rot); color: var(--rot-text);
  }
  .meldung.gut { background: var(--gut); color: var(--gut-text); }
  .meldung code, .fuss code {
    font-family: ui-monospace, Menlo, monospace; font-size: .88em;
    background: hsl(var(--h) 20% 50% / .14); padding: 1px 5px; border-radius: 5px;
  }
  .band {
    border-radius: 14px; padding: 11px 16px; margin-bottom: 16px;
    font-size: .86rem; background: var(--warn); color: var(--warn-text);
  }

  /* ----------------------------------------------------------- Gutscheine */
  /*
    Ein Gutschein ist ein Abriss, keine weitere Karte. Die Kerben links und
    rechts sitzen auf der Perforation - deshalb liegt die Trennlinie genau
    auf ihrer Hoehe.
  */
  .abriss {
    position: relative;
    background: var(--papier);
    border: 1px solid var(--linie);
    border-radius: 14px;
    padding: 16px 18px 18px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .abriss::before, .abriss::after {
    content: ""; position: absolute; top: var(--kerbe, 78px);
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--karte);
    border: 1px solid var(--linie);
  }
  .abriss::before { left: -9px; }
  .abriss::after  { right: -9px; }
  .abriss .wert {
    font-family: var(--display); font-weight: 700;
    font-size: 1.16rem; letter-spacing: -.01em; margin: 0;
  }
  .abriss .frist { font-size: .86rem; color: var(--tinte-leise); margin: 2px 0 0; }
  .abriss .naht {
    border: 0; border-top: 1px dashed var(--linie);
    margin: 16px -18px 15px;
  }
  .abriss.verfallen { opacity: .5; }
  .abriss.verfallen .wert { text-decoration: line-through; }
  /* Ohne Knopf gibt es nichts abzureissen - dann auch keine Kerben. */
  .abriss.ohne-naht::before, .abriss.ohne-naht::after { display: none; }
  .abriss label { margin-top: 2px; }

  /* -------------------------------------------------------------- Angebot */
  .angebot { padding: 13px 0; border-top: 1px solid var(--linie-zart); }
  .angebot:first-child { padding-top: 0; border-top: 0; }
  .angebot b { display: block; font-family: var(--display); font-weight: 600; }
  .angebot span { font-size: .9rem; color: var(--tinte-leise); }

  .leer-text { color: var(--tinte-leise); font-size: .92rem; margin: 0; }
  .verborgen { display: none; }

  .fuss {
    max-width: 460px; margin: 6px auto 0; padding: 0 20px;
    font-size: .78rem; line-height: 1.6; color: var(--tinte-leise);
  }
  .fuss p { margin: 0 0 7px; }
  .fuss a { color: var(--tinte-leise); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-innen">
    <img id="logo" class="verborgen" alt="">
    <div>
      <h1 id="betrieb">TreueBiss</h1>
      <p id="kopf-zeile">Deine Stempelkarte</p>
    </div>
  </div>
</header>

<main>
  <div id="band"></div>
  <div id="meldung"></div>

  <!-- Stempelkarte -->
  <section id="karte-bereich" class="karte verborgen">
    <p class="marke" id="karte-titel">Treuepunkte</p>
    <p class="fortschritt" id="stand-text">Deine Karte ist noch leer.</p>
    <p class="zaehler" id="stand-zahl">0 von 10</p>
    <div class="punkte" id="punkte"></div>

    <div id="scanner" class="verborgen">
      <video id="video" playsinline muted></video>
      <label for="beleg">Nummer vom Kassenbon</label>
      <input id="beleg" autocapitalize="off" spellcheck="false" placeholder="z. B. AMA-2642">
      <div class="reihe">
        <button id="beleg-senden">Stempel holen</button>
        <button id="scan-abbrechen" class="still">Abbrechen</button>
      </div>
    </div>

    <button id="sammeln">Stempel sammeln</button>
  </section>

  <!-- Gutscheine -->
  <section id="gutscheine-bereich" class="karte verborgen">
    <p class="marke" id="gutscheine-titel">Gutscheine</p>
    <div id="gutscheine"></div>
  </section>

  <!-- Angebote -->
  <section id="angebote-bereich" class="karte verborgen">
    <p class="marke" id="angebote-titel">Angebot des Tages</p>
    <div id="angebote"></div>
  </section>
</main>

<footer class="fuss">
  <p id="fuss"></p>
  <p id="rechtliches"></p>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
